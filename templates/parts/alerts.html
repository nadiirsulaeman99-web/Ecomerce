{% if messages %}
{% for message in messages %}
<div class="alert alert-{{message.tags}} alert-dismissible fade show py-1 px-3 shadow-sm " 
    role="alert" 
    style='min-width:500px; position: fixed;top: 50px; left: 50%; transform: translateX(-50%); z-index: 9999; '>
    {% if message.level == DEFOULT_MESSAGE_LEVELS.ERROR %} {% endif %}
    <small><b>{{message}}</b></small>   
    <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.6rem;"></button>             
</div>
{% endfor %}  
{% endif %}  


{% if form.errors %}
    {% for field in form %}
    {% if field.errors %}
        <div class="alert alert-primary alert-dismissible fade show" role="alert">
            {{ field.errors }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endif %}
    {% endfor %}
{% endif %}
