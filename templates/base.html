{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🚀 Title-ka halkan ayaan soo geliyey si uu u noqdo midka ugu sarreeya head-ka -->
    {% block title %}<title>E-Commerce Store</title>{% endblock title %}

    <!-- CSS links -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    
    <!-- 🚀 Hada kan si qumman ayuu u shaqaynayaa sababtoo ah load static ayaa ka horreeya -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Alerts auto-dismiss script -->
    <script>
        setTimeout(function() {
            let alert = document.querySelector('.alert');
            if (alert) {
                alert.style.transition = "opacity 0.6s ease";
                alert.style.opacity = "0";
                setTimeout(() => alert.remove(), 600);
            }
        }, 4000);
    </script>
</head>
<body>
    {% include 'parts/navbar.html' %}
    {% include 'parts/alerts.html' %}
    {% include 'parts/header.html' %}
    
    {% block content %}
    <!-- Halkan waxaa soo gelaya bog kasta xogtiisa -->
    {% endblock content %}
    
    {% include 'parts/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
